name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Pin scan config (pre-push version, never the pushed one)
        # Anthropic principle: a change must not be able to modify the
        # check that judges it. The config scanned with is the version
        # from before this push (or from the PR base branch), never the
        # version in the pushed commits. A config change in a push takes
        # effect on subsequent pushes, and needs human review.
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git show "${{ github.event.pull_request.base.sha }}:.gitleaks.toml" > /tmp/pinned-gitleaks.toml
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git show "$(git merge-base HEAD origin/main):.gitleaks.toml" > /tmp/pinned-gitleaks.toml || git show HEAD:.gitleaks.toml > /tmp/pinned-gitleaks.toml
          elif git show "${{ github.event.before }}:.gitleaks.toml" > /tmp/pinned-gitleaks.toml 2>/dev/null; then
            :
          else
            git show "$(git merge-base HEAD origin/main):.gitleaks.toml" > /tmp/pinned-gitleaks.toml || git show HEAD:.gitleaks.toml > /tmp/pinned-gitleaks.toml
          fi
      - name: Scan pushed commits only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$(git merge-base HEAD origin/main)..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          gitleaks git . --config /tmp/pinned-gitleaks.toml --redact --ignore-gitleaks-allow --log-opts="$RANGE" --exit-code 1
