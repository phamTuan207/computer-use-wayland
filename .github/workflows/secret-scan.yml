name: secret-scan
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Explicit base ref for a new-branch push scan (commit SHA or ref name)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Determine new-branch base
        # On a new-branch push, github.event.before is all zeros, so there
        # is no pushed range to scan. The base is the merge-base of HEAD
        # with the branch this branch was cut from. This repo lands via
        # the todolist-push integration branch, not main, so main alone
        # gives an ancient merge-base (787 commits of old history on
        # pii-verify) and the gate fails on findings that are not from
        # the new commits. Take the newest merge-base across the
        # integration branches, so a branch cut from main still works.
        # An explicit base ref can be passed via workflow_dispatch.
        # Full-history scanning lives only in the separate weekly
        # secret-scan-history workflow, never in this push gate.
        run: |
          set -e
          BASE=""
          if [ -n "${{ inputs.base_ref }}" ]; then
            BASE="$(git rev-parse "${{ inputs.base_ref }}")"
          else
            git fetch origin main --no-tags --quiet || true
            git fetch origin todolist-push --no-tags --quiet || true
            for CANDIDATE in origin/todolist-push origin/main; do
              git rev-parse --verify "$CANDIDATE" >/dev/null 2>&1 || continue
              MB="$(git merge-base HEAD "$CANDIDATE")"
              if [ -z "$BASE" ]; then
                BASE="$MB"
              elif git merge-base --is-ancestor "$BASE" "$MB"; then
                BASE="$MB"
              fi
            done
          fi
          if [ -z "$BASE" ]; then
            echo "could not determine a new-branch base" >&2
            exit 1
          fi
          echo "NEW_BRANCH_BASE=$BASE" >> "$GITHUB_ENV"
          echo "new-branch base: $BASE"
      - name: Pin scan config (pre-push version, never the pushed one)
        # Anthropic principle: a change must not be able to modify the
        # check that judges it. The config scanned with is the version
        # from before this push (or from the PR base branch), never the
        # version in the pushed commits. A config change in a push takes
        # effect on subsequent pushes, and needs human review.
        # Exception, first PR introducing the config: when the PR base
        # has no .gitleaks.toml yet, fall back to the reviewed config
        # in HEAD, and if HEAD has none either, to the default gitleaks
        # config. Without this the first PR fails at the pin step
        # before any scanning happens.
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git show "${{ github.event.pull_request.base.sha }}:.gitleaks.toml" > /tmp/pinned-gitleaks.toml 2>/dev/null; then
              :
            elif git show HEAD:.gitleaks.toml > /tmp/pinned-gitleaks.toml 2>/dev/null; then
              echo "PR base has no .gitleaks.toml, falling back to the reviewed config in HEAD"
            else
              printf '[extend]\nuseDefault = true\n' > /tmp/pinned-gitleaks.toml
              echo "PR base and HEAD have no .gitleaks.toml, using default gitleaks config"
            fi
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git show "$NEW_BRANCH_BASE:.gitleaks.toml" > /tmp/pinned-gitleaks.toml || git show HEAD:.gitleaks.toml > /tmp/pinned-gitleaks.toml
          elif git show "${{ github.event.before }}:.gitleaks.toml" > /tmp/pinned-gitleaks.toml 2>/dev/null; then
            :
          else
            git show "$NEW_BRANCH_BASE:.gitleaks.toml" > /tmp/pinned-gitleaks.toml || git show HEAD:.gitleaks.toml > /tmp/pinned-gitleaks.toml
          fi
      - name: Scan pushed commits only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$NEW_BRANCH_BASE..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          gitleaks git . --config /tmp/pinned-gitleaks.toml --redact --ignore-gitleaks-allow --log-opts="$RANGE" --exit-code 1
