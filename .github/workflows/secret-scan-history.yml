name: secret-scan-history
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        # Full-history sweep for the historical debt (413 findings at
        # landing time). This workflow is NOT a required check: a red run
        # is the signal that starts triage, it blocks nothing.
        run: gitleaks git . --config .gitleaks.toml --redact --ignore-gitleaks-allow --exit-code 1
      - name: Scan working tree (catches binary files)
        # git-mode scans patches, which never show binary content, so a
        # value inside a .pyc, database, zip, or image metadata is
        # invisible to it. Dir mode scans raw bytes, including binaries.
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --ignore-gitleaks-allow --exit-code 1
