name: rung3-checks
on:
  push:
    branches: [todolist-push]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List verify (55 tasks, counts, keys, freeze hash)
        run: python3 rung3-ci/verify-list.py
      - name: Key file hash check (PENDING until the key is frozen)
        run: python3 rung3-ci/check-key-hash.py
      - name: Ledger schema validation
        run: python3 rung3-ci/validate-ledger.py rung3-run-log/R3-L1-grades.jsonl
      - name: Lineage check (required content markers present)
        run: python3 rung3-ci/lineage-check.py
      - name: Architecture guard (import map + machine-value denylist)
        run: python3 rung3-ci/arch-guard.py
      - name: Guard unit tests (rung3-ci)
        run: |
          python3 rung3-ci/test-arch-guard.py
          python3 rung3-ci/test-clean-validate.py
          python3 rung3-ci/test-collect-evidence.py
          python3 rung3-ci/test-seal.py
          python3 rung3-ci/test-signal-hygiene.py
          python3 rung3-ci/test-test-discover.py
          python3 rung3-ci/test_tier_a_check.py
      - name: zen-rdp unit tests (pure stdlib, no browser)
        working-directory: scripts/zen-rdp
        run: |
          python3 test_envelope.py
          python3 test_redaction.py
          python3 test_scope_unittest.py
          python3 test_rdp_smoke.py
      - name: Hermetic suite gate (no stripped-env-only failures)
        run: python3 rung3-ci/test-discover.py hermetic --timeout 1800
      - name: M14 probe gate (frozen Y1b suite + ledger row, ledger mode)
        run: python3 probes/probe-gate.py
