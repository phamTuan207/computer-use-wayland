name: rung3-checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lineage check (required content markers present)
        run: python3 rung3-ci/lineage-check.py
      - name: Architecture guard (import map + machine-value denylist)
        run: python3 rung3-ci/arch-guard.py
      - name: Guard unit tests (rung3-ci)
        run: |
          python3 rung3-ci/test-arch-guard.py
          python3 rung3-ci/test-test-discover.py
          python3 rung3-ci/test-stall-detector.py
          python3 rung3-ci/test-check-commit-identity.py
      # Phase 0 (2026-11-28): new PR commits must carry noreply
      # author/committer emails so personal mailbox forms stop
      # entering history metadata. PR range only; merge-commit
      # author identity is controlled by the account's GitHub
      # email-privacy settings.
      - name: Commit identity (noreply emails on PR commits)
        if: github.event_name == 'pull_request'
        run: python3 rung3-ci/check-commit-identity.py ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: zen-rdp unit tests (pure stdlib, no browser)
        working-directory: scripts/zen-rdp
        run: |
          python3 test_envelope.py
          python3 test_redaction.py
          python3 test_scope_unittest.py
          python3 test_rdp_smoke.py
          python3 test_lock.py
          python3 test_act.py
          python3 test_f11_terminal.py
          python3 test_f1_replay.py
          python3 test_snapshot.py
          python3 test_zen_spaces.py
          python3 test_launch_dedicated.py
          python3 test_p2b_settling.py
          python3 test_act_count_js.py
          python3 test_bench.py
          python3 test_p3_probe.py
      # Non-blocking for now: 35 pre-existing tests depend on optional
      # tools (git, node, wayland, built binaries) and fail stripped
      # on main today (verified 2026-11-28, identical before/after
      # the arch-guard cleanup). Flip to blocking once those tests
      # mock or guard their tool deps.
      - name: Hermetic suite gate (no stripped-env-only failures)
        continue-on-error: true
        run: python3 rung3-ci/test-discover.py hermetic --timeout 1800
