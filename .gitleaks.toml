# Shared by the pre-commit hook and the CI job. Extends the built-in
# rules (tokens, keys, passwords) with PII rules. The built-in rules
# catch the token leak. The custom rules catch the personal-data leak.
# Neither fires on the approved placeholder values.
#
# Every allowlist regex is anchored (^...$) to the FULL matched secret.
# An unanchored allowlist matches a substring, which let realistic values
# through (192.168.1.10 via 192.168.1.1, 1123 Main Street via
# 123 Main Street, user@example.com.evil.com via @example.com).
# The allowlists use the [[rules.allowlists]] (plural) form, which is the
# non-deprecated form in gitleaks 8.30.1.

[extend]
useDefault = true

# Personal email outside approved placeholder domains.
[[rules]]
id = "personal-email"
description = "Email address outside approved placeholder domains"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
[[rules.allowlists]]
regexes = ['''^[A-Za-z0-9._%+-]+@example\.(com|net|org)$''', '''^[A-Za-z0-9._%+-]+@test\.com$''', '''^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(test|example|invalid)$''', '''^[0-9]+\+[A-Za-z0-9._-]+@users\.noreply\.github\.com$''', '''^[A-Za-z0-9._-]+@users\.noreply\.github\.com$''']

# Street address: number plus street name plus street type.
[[rules]]
id = "street-address"
description = "Street address: number plus street name plus street type"
regex = '''\b\d{1,6}\s+[A-Za-z][A-Za-z0-9.'-]{1,30}(?:\s+[A-Za-z][A-Za-z0-9.'-]{1,30}){0,3}\s+(?:Street|St|Avenue|Ave|Road|Rd|Lane|Ln|Drive|Dr|Boulevard|Blvd|Court|Ct|Place|Pl|Way|Terrace|Square|Sq|Alley|Highway|Hwy)\b'''
[[rules.allowlists]]
regexes = ['''^123 Main Street$''', '''^123 Example Street$''']

# Phone number with separators. Separators are required so the rule
# does not fire on DOIs, URLs, or version numbers.
[[rules]]
id = "phone-number"
description = "Phone number with separators"
regex = '''\b(?:\+?\d{1,3}[-. ])?\(?\d{2,4}\)?[-. ]\d{3,4}[-. ]\d{4}\b'''
[[rules.allowlists]]
regexes = ['''^\(?\d{3}\)?[-. ]555-01\d\d$''', '''^\(?555\) \d{3}-\d{4}$''']

# Private or CGNAT IP address (covers home LAN and Tailscale-style IPs).
# RFC 5737 documentation ranges are allowlisted so examples pass.
# 192.168.1.1 was removed from the allowlist: it is a real, extremely
# common home router address, and unanchored it also let 192.168.1.10
# through 192.168.1.199 pass.
[[rules]]
id = "private-ip"
description = "Private or CGNAT IP address"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3})\b'''
[[rules.allowlists]]
regexes = ['''^192\.0\.2\.\d{1,3}$''', '''^198\.51\.100\.\d{1,3}$''', '''^203\.0\.113\.\d{1,3}$''']

# R3-L3 false positives (2026-11-24, verified by hand before merge of PR #253):
# the two 64-hex strings are sha256 file-integrity hashes recorded in
# rung3-run-log/thu-tu-chay.txt (docs/rung3-answer-keys.md and
# docs/rung3-answer-keys.json), not API keys; dung@test.org is the
# placeholder email in the R3-013 regex-count sample text (the other two
# sample emails are already covered by the @example.com allowlist).
# Anchored to the full secret, same as the rule allowlists above.
[allowlist]
description = "R3-L3 false positives: file-integrity sha256 hashes and R3-013 fixture email"
regexes = ['''^21f8b61a6eaa0097e9840adb218f15e99d446fc2a62968aef614116c8831bc60$''', '''^5059f6c447f9df0b63c092589bbba0df9efe37b2b6b962f7a32194054abfdae8$''', '''^dung@test\.org$''']
