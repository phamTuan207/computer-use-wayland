<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialogs and popups</title>
<style>
body { font-family: sans-serif; max-width: 640px; margin: 2em auto; }
button { display: block; margin: 0.6em 0; }
#modal { display: none; border: 1px solid #888; padding: 1em; margin-top: 1em; }
#outcomes { margin-top: 1em; }
#outcomes div { margin: 0.2em 0; }
</style>
</head>
<body>
<h1>Dialogs and popups</h1>
<button id="alert-btn">Show alert</button>
<button id="confirm-btn">Ask confirm</button>
<button id="prompt-btn">Ask name</button>
<button id="modal-btn">Open modal</button>
<button id="popup-btn">Open popup</button>
<div id="modal">
  <label for="note">Review note</label>
  <input id="note" type="text">
  <button id="modal-save">Save note</button>
  <button id="modal-cancel">Cancel</button>
</div>
<div id="outcomes">
  <div id="out-alert"></div>
  <div id="out-confirm"></div>
  <div id="out-prompt"></div>
  <div id="out-modal"></div>
  <div id="out-popup"></div>
</div>
<script>
document.getElementById('alert-btn').addEventListener('click', () => {
  window.alert('Review is ready.');
  document.getElementById('out-alert').textContent = 'alert accepted';
});
document.getElementById('confirm-btn').addEventListener('click', () => {
  const ok = window.confirm('Publish this problem?');
  document.getElementById('out-confirm').textContent = ok ? 'confirmed' : 'cancelled';
});
document.getElementById('prompt-btn').addEventListener('click', () => {
  const name = window.prompt('Your name:', '');
  document.getElementById('out-prompt').textContent = 'name: ' + (name === null ? 'none' : name);
});
const modal = document.getElementById('modal');
document.getElementById('modal-btn').addEventListener('click', () => {
  modal.style.display = 'block';
});
document.getElementById('modal-save').addEventListener('click', () => {
  document.getElementById('out-modal').textContent =
    'note: ' + document.getElementById('note').value;
  modal.style.display = 'none';
});
document.getElementById('modal-cancel').addEventListener('click', () => {
  modal.style.display = 'none';
});
document.getElementById('popup-btn').addEventListener('click', () => {
  window.open('popup.html', 't06popup', 'width=400,height=300');
});
window.addEventListener('message', (event) => {
  if (event.data && event.data.popupName) {
    document.getElementById('out-popup').textContent = 'popup name: ' + event.data.popupName;
  }
});
</script>
</body>
</html>
