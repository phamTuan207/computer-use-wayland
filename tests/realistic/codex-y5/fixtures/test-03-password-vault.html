<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vault Desk</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:25px;background:#101827;color:#e6edf7;font:14px system-ui,sans-serif}.app{max-width:820px;margin:auto;background:#182338;border:1px solid #344865;border-radius:12px;overflow:hidden}header{padding:18px 22px;background:#1e2d47;display:flex;justify-content:space-between;align-items:center}h1{margin:0;color:#9fc4ff;font-size:21px}.badge{padding:7px 10px;border-radius:6px;background:#263a5b}.badge b{color:#fff}main{padding:20px;display:grid;gap:14px}.panel{padding:16px;background:#121d30;border:1px solid #30435f;border-radius:8px}h2{margin:0 0 12px;font-size:16px}.row{display:flex;gap:8px;margin:9px 0;flex-wrap:wrap}input{font:inherit;padding:9px 10px;color:#edf4ff;background:#0d1625;border:1px solid #3a506e;border-radius:5px;min-width:190px}button{font:inherit;padding:9px 12px;color:#fff;background:#30496b;border:1px solid #48658b;border-radius:5px;cursor:pointer}button:hover{background:#3c5a82}.status{padding:9px;background:#1c2b42;color:#acd0ff;border-radius:5px;min-height:36px}.entry{padding:12px;border:1px solid #32445f;border-radius:6px;margin-top:10px}.entry p{margin:5px 0}.muted{color:#9daec5}
  </style>
</head>
<body>
<div class="app">
  <header><h1>Vault Desk</h1><div class="badge">Vault: <b id="vault-status">Locked</b> | Entries: <b id="vault-entry-count">0</b></div></header>
  <main>
    <section class="panel"><h2>Unlock vault</h2><div class="row"><input id="master-key-input" type="password" placeholder="vault key"><button id="btn-unlock-vault">Unlock vault</button><button id="btn-lock-vault">Lock vault</button></div><div id="vault-message" class="status">Vault locked</div></section>
    <section class="panel"><h2>Saved entries</h2><button id="btn-add-entry">Add entry</button><button id="btn-edit-entry" hidden>Edit entry</button><button id="btn-delete-entry" hidden>Delete entry</button><button id="btn-undo-delete" hidden>Undo delete</button><div id="entry-list"><p class="muted">No saved entries</p></div></section>
    <section id="entry-editor" class="panel" hidden><h2>Entry details</h2><div class="row"><input id="entry-title-input" placeholder="service name"><input id="entry-username-input" placeholder="account label"></div><div class="row"><input id="entry-password-input" type="password" placeholder="password"><button id="btn-generate-password">Generate password</button><button id="btn-save-entry">Save entry</button></div></section>
    <section class="panel"><h2>Selected entry</h2><p>Title: <b id="entry-title-display">None</b></p><p>Username: <b id="entry-username-display">None</b></p><p>Password: <b id="password-mask">No password</b></p><div class="row"><button id="btn-reveal-password">Reveal or hide password</button><button id="btn-copy-password">Copy password</button></div><div>Copy status: <b id="copy-status">Nothing copied</b></div><label>Fixture clipboard (local) <input id="clipboard-buffer" aria-label="fixture clipboard buffer" readonly></label><div>Delete status: <b id="delete-status">No deletion</b></div></section>
  </main>
</div>
<script>
  const generatedPassword = 'Cedar!9-Glass?';
  let unlocked = false;
  let entry = null;
  let deletedEntry = null;
  let revealed = false;
  const el = (selector) => document.querySelector(selector);
  function render() {
    el('#vault-status').textContent = unlocked ? 'Unlocked' : 'Locked';
    el('#vault-entry-count').textContent = entry ? '1' : '0';
    el('#entry-list').textContent = entry ? `${entry.title}\n${entry.username}` : 'No saved entries';
    el('#entry-title-display').textContent = unlocked && entry ? entry.title : 'None';
    el('#entry-username-display').textContent = unlocked && entry ? entry.username : 'None';
    el('#password-mask').textContent = unlocked && entry ? (revealed ? entry.password : '••••••••••••••') : (entry ? 'Locked' : 'No password');
    el('#btn-edit-entry').hidden = !unlocked || !entry;
    el('#btn-delete-entry').hidden = !unlocked || !entry;
    el('#btn-add-entry').disabled = !unlocked;
  }
  el('#btn-unlock-vault').onclick = () => {
    if (el('#master-key-input').value !== 'vault-access-key') {
      el('#vault-message').textContent = 'Vault key not accepted';
      return;
    }
    unlocked = true;
    el('#master-key-input').value = '';
    el('#vault-message').textContent = 'Vault unlocked';
    render();
  };
  el('#btn-lock-vault').onclick = () => {
    unlocked = false;
    revealed = false;
    el('#entry-editor').hidden = true;
    el('#vault-message').textContent = 'Vault locked';
    render();
  };
  el('#btn-add-entry').onclick = () => {
    if (!unlocked) return;
    el('#entry-editor').hidden = false;
    el('#entry-title-input').value = '';
    el('#entry-username-input').value = '';
    el('#entry-password-input').value = '';
  };
  el('#btn-generate-password').onclick = () => {
    if (unlocked) el('#entry-password-input').value = generatedPassword;
  };
  el('#btn-save-entry').onclick = () => {
    if (!unlocked) return;
    const title = el('#entry-title-input').value.trim();
    const username = el('#entry-username-input').value.trim();
    const password = el('#entry-password-input').value;
    if (!title || !username || !password) return;
    entry = { title, username, password };
    revealed = false;
    el('#entry-editor').hidden = true;
    render();
  };
  el('#btn-edit-entry').onclick = () => {
    if (!unlocked || !entry) return;
    el('#entry-editor').hidden = false;
    el('#entry-title-input').value = entry.title;
    el('#entry-username-input').value = entry.username;
    el('#entry-password-input').value = entry.password;
  };
  el('#btn-delete-entry').onclick = () => {
    if (!unlocked || !entry) return;
    deletedEntry = entry;
    entry = null;
    revealed = false;
    el('#delete-status').textContent = 'Entry deleted by mistake';
    el('#btn-undo-delete').hidden = false;
    render();
  };
  el('#btn-undo-delete').onclick = () => {
    if (!deletedEntry) return;
    entry = deletedEntry;
    deletedEntry = null;
    el('#delete-status').textContent = 'Entry restored';
    el('#btn-undo-delete').hidden = true;
    render();
  };
  el('#btn-reveal-password').onclick = () => {
    if (!unlocked || !entry) return;
    revealed = !revealed;
    render();
  };
  el('#btn-copy-password').onclick = () => {
    if (!unlocked || !entry) return;
    el('#clipboard-buffer').value = entry.password;
    el('#copy-status').textContent = 'Password copied';
  };
  render();
</script>
</body>
</html>
