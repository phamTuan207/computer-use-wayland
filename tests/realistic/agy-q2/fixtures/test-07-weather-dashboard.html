<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global Weather Operations Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 20px; }
    h1 { font-size: 22px; color: #f1f5f9; }
    .status-banner { padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; display: none; margin-bottom: 20px; }
    .status-banner.success { display: block; background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .status-banner.error { display: block; background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 18px; border-radius: 8px; margin-bottom: 24px; border: 1px solid #334155; }
    .unit-toggle { display: inline-flex; background: #0f172a; border-radius: 6px; padding: 3px; border: 1px solid #334155; }
    .unit-btn { background: transparent; border: none; color: #94a3b8; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 4px; }
    .unit-btn.active { background: #3b82f6; color: #fff; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; border: 1px solid #b91c1c; }
    select { padding: 8px 12px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; font-size: 13px; }
    .cities-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
    .city-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; position: relative; }
    .city-card.primary-city { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); }
    .city-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .city-name { font-size: 18px; font-weight: 700; color: #f8fafc; }
    .city-country { font-size: 12px; color: #94a3b8; }
    .temp-large { font-size: 34px; font-weight: 800; color: #38bdf8; margin: 8px 0; }
    .condition-text { font-size: 13px; color: #cbd5e1; font-weight: 500; }
    .meta-metrics { display: flex; gap: 16px; font-size: 12px; color: #94a3b8; margin-top: 8px; }
    .forecast-row { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid #334155; padding-top: 10px; }
    .forecast-col { flex: 1; background: #0f172a; padding: 6px 8px; border-radius: 4px; text-align: center; }
    .forecast-day { font-size: 11px; color: #64748b; font-weight: 600; }
    .forecast-temp { font-size: 12px; font-weight: 700; color: #e2e8f0; margin-top: 2px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .primary-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; background: #0284c7; color: #fff; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Global Weather Operations</h1>
      <div style="font-size: 13px; color: #94a3b8; margin-top: 4px;">
        Active Units: <strong id="active-unit-indicator">°C</strong> | Monitored Cities: <strong id="stat-city-count">3</strong>
      </div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <div class="unit-toggle">
        <button id="btn-unit-c" class="unit-btn active">°C</button>
        <button id="btn-unit-f" class="unit-btn">°F</button>
      </div>
      <button id="btn-save-weather" class="btn btn-primary">Save Weather Dashboard</button>
    </div>
  </header>

  <div id="weather-status-banner" class="status-banner"></div>

  <div class="toolbar">
    <div style="display: flex; gap: 10px; align-items: center;">
      <label for="select-add-city" style="font-size: 13px; color: #cbd5e1; font-weight: 500;">Add Station:</label>
      <select id="select-add-city">
        <option value="">Choose city...</option>
        <option value="ho-chi-minh-city">Ho Chi Minh City, Vietnam</option>
        <option value="sydney">Sydney, Australia</option>
        <option value="reykjavik">Reykjavik, Iceland</option>
      </select>
      <button id="btn-add-city" class="btn btn-secondary">+ Add City</button>
    </div>
    <div style="font-size: 12px; color: #64748b;">
      Auto-refresh: Simulated (Offline)
    </div>
  </div>

  <div id="cities-container" class="cities-grid"></div>
</div>

<script>
(function() {
  let activeUnit = 'C';
  let primaryCityId = 'tokyo';
  let dashboardSaved = false;

  const cityDatabase = {
    'tokyo': { id: 'tokyo', name: 'Tokyo', country: 'Japan', tempC: 18, condition: 'Partly Cloudy', humidity: 62, wind: 14, forecastC: [17, 19, 21] },
    'london': { id: 'london', name: 'London', country: 'United Kingdom', tempC: 12, condition: 'Overcast & Drizzle', humidity: 81, wind: 22, forecastC: [11, 13, 10] },
    'new-york': { id: 'new-york', name: 'New York', country: 'United States', tempC: 15, condition: 'Clear', humidity: 50, wind: 16, forecastC: [14, 16, 18] },
    'ho-chi-minh-city': { id: 'ho-chi-minh-city', name: 'Ho Chi Minh City', country: 'Vietnam', tempC: 32, condition: 'Tropical Warmth', humidity: 75, wind: 10, forecastC: [33, 32, 31] },
    'sydney': { id: 'sydney', name: 'Sydney', country: 'Australia', tempC: 22, condition: 'Sunny Breeze', humidity: 58, wind: 18, forecastC: [23, 24, 22] },
    'reykjavik': { id: 'reykjavik', name: 'Reykjavik', country: 'Iceland', tempC: -2, condition: 'Snow Showers', humidity: 88, wind: 35, forecastC: [-3, -1, -4] }
  };

  let monitoredCities = ['tokyo', 'london', 'new-york'];

  function toF(c) {
    return Math.round(c * 9 / 5 + 32);
  }

  function formatTemp(c) {
    if (activeUnit === 'F') {
      return toF(c) + '°F';
    }
    return c + '°C';
  }

  function renderDashboard() {
    const container = document.getElementById('cities-container');
    container.innerHTML = '';
    document.getElementById('stat-city-count').textContent = monitoredCities.length;
    document.getElementById('active-unit-indicator').textContent = '°' + activeUnit;

    const days = ['Tomorrow', '+2 Days', '+3 Days'];

    monitoredCities.forEach(cityId => {
      const data = cityDatabase[cityId];
      if (!data) return;

      const isPrimary = (cityId === primaryCityId);
      const card = document.createElement('div');
      card.id = 'card-city-' + cityId;
      card.className = 'city-card' + (isPrimary ? ' primary-city' : '');

      let forecastHtml = '';
      data.forecastC.forEach((fc, idx) => {
        forecastHtml += `
          <div class="forecast-col">
            <div class="forecast-day">${days[idx]}</div>
            <div class="forecast-temp">${formatTemp(fc)}</div>
          </div>
        `;
      });

      card.innerHTML = `
        <div>
          <div class="city-header">
            <div>
              <div class="city-name">${data.name}</div>
              <div class="city-country">${data.country}</div>
            </div>
            ${isPrimary ? `<span id="badge-primary-${cityId}" class="primary-badge">Primary</span>` : ''}
          </div>
          <div id="temp-${cityId}" class="temp-large">${formatTemp(data.tempC)}</div>
          <div class="condition-text">${data.condition}</div>
          <div class="meta-metrics">
            <span>Humidity: ${data.humidity}%</span>
            <span>Wind: ${data.wind} km/h</span>
          </div>
          <div class="forecast-row">
            ${forecastHtml}
          </div>
        </div>
        <div class="card-footer">
          <button id="btn-primary-city-${cityId}" class="btn btn-secondary" style="padding: 4px 10px; font-size: 11px;">
            ${isPrimary ? 'Default' : 'Set Primary'}
          </button>
          <button id="btn-remove-city-${cityId}" class="btn btn-danger" style="padding: 4px 10px; font-size: 11px;">
            Remove
          </button>
        </div>
      `;
      container.appendChild(card);

      card.querySelector(`#btn-primary-city-${cityId}`).addEventListener('click', () => {
        primaryCityId = cityId;
        dashboardSaved = false;
        renderDashboard();
      });

      card.querySelector(`#btn-remove-city-${cityId}`).addEventListener('click', () => {
        monitoredCities = monitoredCities.filter(id => id !== cityId);
        if (primaryCityId === cityId && monitoredCities.length > 0) {
          primaryCityId = monitoredCities[0];
        }
        dashboardSaved = false;
        renderDashboard();
      });
    });
  }

  document.getElementById('btn-unit-c').addEventListener('click', () => {
    activeUnit = 'C';
    document.getElementById('btn-unit-c').classList.add('active');
    document.getElementById('btn-unit-f').classList.remove('active');
    renderDashboard();
  });

  document.getElementById('btn-unit-f').addEventListener('click', () => {
    activeUnit = 'F';
    document.getElementById('btn-unit-f').classList.add('active');
    document.getElementById('btn-unit-c').classList.remove('active');
    renderDashboard();
  });

  document.getElementById('btn-add-city').addEventListener('click', () => {
    const sel = document.getElementById('select-add-city');
    const val = sel.value;
    if (val && !monitoredCities.includes(val)) {
      monitoredCities.push(val);
      sel.value = '';
      dashboardSaved = false;
      renderDashboard();
    }
  });

  document.getElementById('btn-save-weather').addEventListener('click', () => {
    dashboardSaved = true;
    const banner = document.getElementById('weather-status-banner');
    banner.className = 'status-banner success';
    const primaryName = cityDatabase[primaryCityId] ? cityDatabase[primaryCityId].name : 'None';
    banner.textContent = `Dashboard saved: ${monitoredCities.length} cities monitored in °${activeUnit} (Primary: ${primaryName})`;
  });

  // Initial render
  renderDashboard();

  // Verification hook (REAL DOM only - no self-simulation)
  window.__agyVerify = function() {
    const failures = [];
    const bannerText = document.getElementById('weather-status-banner').textContent.trim();

    if (!dashboardSaved) {
      failures.push('Dashboard was not saved via btn-save-weather');
    }
    if (activeUnit !== 'F') {
      failures.push(`Expected active unit 'F', got '${activeUnit}'`);
    }
    if (monitoredCities.length !== 4) {
      failures.push(`Expected 4 monitored cities, got ${monitoredCities.length}`);
    }
    if (primaryCityId !== 'ho-chi-minh-city') {
      failures.push(`Expected primary city 'ho-chi-minh-city', got '${primaryCityId}'`);
    }
    if (monitoredCities.includes('reykjavik')) {
      failures.push('Reykjavik should have been removed');
    }
    if (!monitoredCities.includes('ho-chi-minh-city')) {
      failures.push('Ho Chi Minh City must be present');
    }

    const hcmTemp = document.getElementById('temp-ho-chi-minh-city');
    if (!hcmTemp || hcmTemp.textContent.trim() !== '90°F') {
      failures.push(`Expected Ho Chi Minh City temp '90°F', got '${hcmTemp ? hcmTemp.textContent.trim() : 'missing'}'`);
    }

    if (!bannerText.includes('Dashboard saved: 4 cities monitored in °F (Primary: Ho Chi Minh City)')) {
      failures.push(`Banner text mismatch, got '${bannerText}'`);
    }

    return {
      passed: failures.length === 0,
      failures,
      score: failures.length === 0 ? 1 : 0,
      state: {
        dashboardSaved,
        activeUnit,
        cityCount: monitoredCities.length,
        primaryCity: primaryCityId,
        banner: bannerText
      }
    };
  };
})();
</script>
</body>
</html>
