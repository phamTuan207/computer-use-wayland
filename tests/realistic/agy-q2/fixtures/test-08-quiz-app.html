<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Systems Architecture & Web Standards Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #1e293b; padding: 24px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 20px; }
    h1 { font-size: 20px; color: #0f172a; }
    .status-banner { padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; display: none; margin-bottom: 20px; }
    .status-banner.success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-banner.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .progress-bar-wrap { background: #e2e8f0; border-radius: 9999px; height: 8px; width: 100%; overflow: hidden; margin-bottom: 12px; }
    .progress-fill { background: #2563eb; height: 100%; width: 20%; transition: width 0.2s ease; }
    .question-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .question-title { font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 16px; }
    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .option-item { display: flex; align-items: center; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; transition: background 0.15s ease; }
    .option-item:hover { background: #f1f5f9; }
    .option-item input[type="radio"] { margin-right: 12px; transform: scale(1.1); cursor: pointer; }
    .option-text { font-size: 14px; font-weight: 500; color: #334155; }
    .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .btn { padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-success { background: #059669; color: #fff; }
    .results-card { display: none; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 20px; margin-top: 20px; text-align: center; }
    .score-badge { font-size: 32px; font-weight: 800; color: #15803d; margin: 10px 0; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Architecture & Web Standards Quiz</h1>
      <div style="font-size: 12px; color: #64748b; margin-top: 4px;">
        Assessment Mode | Timer: <span id="quiz-timer">120s</span>
      </div>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #2563eb;">
      <span id="progress-text">Question 1 of 5</span>
    </div>
  </header>

  <div id="quiz-status-banner" class="status-banner"></div>

  <div class="progress-bar-wrap">
    <div id="progress-fill" class="progress-fill"></div>
  </div>

  <div id="quiz-main-view">
    <div class="question-card">
      <div id="question-text" class="question-title">Loading question...</div>
      <div id="options-container" class="options-list"></div>
    </div>

    <div class="nav-buttons">
      <button id="btn-prev-question" class="btn btn-secondary" style="display: none;">Previous Question</button>
      <div style="margin-left: auto; display: flex; gap: 10px;">
        <button id="btn-next-question" class="btn btn-primary">Next Question</button>
        <button id="btn-submit-quiz" class="btn btn-success" style="display: none;">Submit Quiz</button>
      </div>
    </div>
  </div>

  <div id="quiz-results-card" class="results-card">
    <h2 style="font-size: 18px; color: #166534;">Quiz Evaluation Complete</h2>
    <div id="stat-final-score" class="score-badge">0 / 5</div>
    <div id="stat-score-percent" style="font-size: 15px; font-weight: 600; color: #166534; margin-bottom: 16px;">0%</div>
    <div id="answers-breakdown" style="text-align: left; background: #fff; border: 1px solid #dcfce7; border-radius: 6px; padding: 14px; margin-bottom: 16px; font-size: 13px;"></div>
    <button id="btn-save-quiz" class="btn btn-primary">Save Quiz Results</button>
  </div>
</div>

<script>
(function() {
  const questions = [
    {
      id: 'q1',
      text: "Which HTTP status code represents 'Created'?",
      options: [
        { id: 'opt-q1-200', text: '200 OK', correct: false },
        { id: 'opt-q1-201', text: '201 Created', correct: true },
        { id: 'opt-q1-204', text: '204 No Content', correct: false },
        { id: 'opt-q1-301', text: '301 Moved Permanently', correct: false }
      ]
    },
    {
      id: 'q2',
      text: 'What is the primary role of the Wayland compositor?',
      options: [
        { id: 'opt-q2-bridge', text: 'X11 protocol translation bridge', correct: false },
        { id: 'opt-q2-compositor', text: 'Direct display server and window compositor', correct: true },
        { id: 'opt-q2-audio', text: 'System sound server mixer pipeline', correct: false },
        { id: 'opt-q2-dns', text: 'Local loopback DNS resolution daemon', correct: false }
      ]
    },
    {
      id: 'q3',
      text: 'Which data structure provides O(1) average time complexity for lookup?',
      options: [
        { id: 'opt-q3-linked-list', text: 'Linked List', correct: false },
        { id: 'opt-q3-hash-table', text: 'Hash Table', correct: true },
        { id: 'opt-q3-bst', text: 'Binary Search Tree', correct: false },
        { id: 'opt-q3-heap', text: 'Binary Min Heap', correct: false }
      ]
    },
    {
      id: 'q4',
      text: 'Which CSS declaration promotes an element to a GPU compositing layer?',
      options: [
        { id: 'opt-q4-float', text: 'float: left', correct: false },
        { id: 'opt-q4-color', text: 'color: var(--accent)', correct: false },
        { id: 'opt-q4-will-change', text: 'will-change: transform', correct: true },
        { id: 'opt-q4-display', text: 'display: inline-block', correct: false }
      ]
    },
    {
      id: 'q5',
      text: "Which signal is dispatched by 'kill -9' in Unix?",
      options: [
        { id: 'opt-q5-sigint', text: 'SIGINT', correct: false },
        { id: 'opt-q5-sigterm', text: 'SIGTERM', correct: false },
        { id: 'opt-q5-sigkill', text: 'SIGKILL', correct: true },
        { id: 'opt-q5-sighup', text: 'SIGHUP', correct: false }
      ]
    }
  ];

  let currentIndex = 0;
  let userAnswers = {};
  let quizSubmitted = false;
  let resultsSaved = false;

  function renderCurrentQuestion() {
    const q = questions[currentIndex];
    document.getElementById('question-text').textContent = q.text;
    document.getElementById('progress-text').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
    document.getElementById('progress-fill').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.options.forEach(opt => {
      const label = document.createElement('label');
      label.className = 'option-item';
      label.setAttribute('for', opt.id);

      const checked = userAnswers[q.id] === opt.id ? 'checked' : '';
      label.innerHTML = `
        <input type="radio" id="${opt.id}" name="question-${q.id}" value="${opt.id}" ${checked}>
        <span class="option-text">${opt.text}</span>
      `;
      container.appendChild(label);

      label.querySelector('input').addEventListener('change', () => {
        userAnswers[q.id] = opt.id;
      });
    });

    document.getElementById('btn-prev-question').style.display = (currentIndex > 0) ? 'block' : 'none';
    if (currentIndex === questions.length - 1) {
      document.getElementById('btn-next-question').style.display = 'none';
      document.getElementById('btn-submit-quiz').style.display = 'block';
    } else {
      document.getElementById('btn-next-question').style.display = 'block';
      document.getElementById('btn-submit-quiz').style.display = 'none';
    }
  }

  document.getElementById('btn-next-question').addEventListener('click', () => {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderCurrentQuestion();
    }
  });

  document.getElementById('btn-prev-question').addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderCurrentQuestion();
    }
  });

  document.getElementById('btn-submit-quiz').addEventListener('click', () => {
    quizSubmitted = true;
    let score = 0;
    const breakdownEl = document.getElementById('answers-breakdown');
    breakdownEl.innerHTML = '';

    questions.forEach((q, idx) => {
      const selected = userAnswers[q.id];
      const correctOpt = q.options.find(o => o.correct);
      const isCorrect = (selected === correctOpt.id);
      if (isCorrect) score++;

      const div = document.createElement('div');
      div.style.marginBottom = '6px';
      div.innerHTML = `<strong>Q${idx + 1}:</strong> ${isCorrect ? '<span style="color: #16a34a;">Correct</span>' : '<span style="color: #dc2626;">Incorrect</span>'} (${correctOpt.text})`;
      breakdownEl.appendChild(div);
    });

    document.getElementById('stat-final-score').textContent = `${score} / ${questions.length}`;
    document.getElementById('stat-score-percent').textContent = `${Math.round((score / questions.length) * 100)}%`;
    document.getElementById('quiz-main-view').style.display = 'none';
    document.getElementById('quiz-results-card').style.display = 'block';
  });

  document.getElementById('btn-save-quiz').addEventListener('click', () => {
    resultsSaved = true;
    let score = 0;
    questions.forEach(q => {
      const selected = userAnswers[q.id];
      const correctOpt = q.options.find(o => o.correct);
      if (selected === correctOpt.id) score++;
    });

    const banner = document.getElementById('quiz-status-banner');
    banner.className = 'status-banner success';
    banner.textContent = `Quiz completed: ${score}/${questions.length} score (${Math.round((score / questions.length) * 100)}%) - Results verified and saved`;
  });

  // Initial render
  renderCurrentQuestion();

  // Verification hook (REAL DOM only - no self-simulation)
  window.__agyVerify = function() {
    const failures = [];
    const bannerText = document.getElementById('quiz-status-banner').textContent.trim();

    if (!quizSubmitted) {
      failures.push('Quiz was not submitted via btn-submit-quiz');
    }
    if (!resultsSaved) {
      failures.push('Results were not saved via btn-save-quiz');
    }

    let score = 0;
    questions.forEach(q => {
      const selected = userAnswers[q.id];
      const correctOpt = q.options.find(o => o.correct);
      if (selected === correctOpt.id) score++;
    });

    if (score !== 5) {
      failures.push(`Expected perfect score 5/5, got ${score}/5`);
    }

    const finalScoreEl = document.getElementById('stat-final-score');
    if (!finalScoreEl || !finalScoreEl.textContent.includes('5 / 5')) {
      failures.push(`Score display mismatch: got '${finalScoreEl ? finalScoreEl.textContent : 'none'}'`);
    }

    if (!bannerText.includes('Quiz completed: 5/5 score (100%) - Results verified and saved')) {
      failures.push(`Banner text mismatch, got '${bannerText}'`);
    }

    return {
      passed: failures.length === 0,
      failures,
      score: failures.length === 0 ? 1 : 0,
      state: {
        quizSubmitted,
        resultsSaved,
        score,
        banner: bannerText
      }
    };
  };
})();
</script>
</body>
</html>
