<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline Budget & Expense Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f3f4f6; color: #1f2937; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 16px; margin-bottom: 16px; }
    h1 { font-size: 22px; color: #111827; }
    .status-banner { padding: 10px 14px; border-radius: 4px; font-size: 13px; font-weight: 500; display: none; margin-bottom: 16px; }
    .status-banner.success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-banner.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 14px; text-align: center; }
    .stat-label { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; }
    .stat-val { font-size: 22px; font-weight: 700; color: #111827; margin-top: 4px; }
    .status-safe { color: #16a34a; }
    .status-warn { color: #dc2626; }
    .form-row { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 14px 18px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    input[type="text"], input[type="number"], input[type="date"], select { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; }
    .btn { padding: 7px 14px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .main-grid { display: grid; grid-template-columns: 2.5fr 1fr; gap: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f9fafb; font-weight: 600; color: #4b5563; }
    .cat-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; background: #e0e7ff; color: #3730a3; }
    .sidebar { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 16px; }
    .breakdown-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #e5e7eb; font-size: 13px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Budget & Expense Tracker</h1>
    <div style="display: flex; gap: 12px; align-items: center;">
      <label for="input-monthly-budget" style="font-size: 13px; font-weight: 500;">Monthly Budget ($):</label>
      <input type="number" id="input-monthly-budget" value="2500" style="width: 100px;">
      <button id="btn-set-budget" class="btn btn-secondary">Set Budget</button>
      <button id="btn-save-budget" class="btn btn-primary">Save Budget Report</button>
    </div>
  </header>

  <div id="budget-status-banner" class="status-banner"></div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Budget Limit</div>
      <div id="stat-budget-limit" class="stat-val">$2500.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Spent</div>
      <div id="stat-total-spent" class="stat-val">$1475.50</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Remaining</div>
      <div id="stat-remaining-budget" class="stat-val status-safe">$1024.50</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Budget Status</div>
      <div id="stat-budget-status" class="stat-val status-safe">Safe</div>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label for="input-expense-desc" style="font-size: 12px; font-weight: 500; display: block; margin-bottom: 3px;">Description:</label>
      <input type="text" id="input-expense-desc" placeholder="e.g. Cloud Server Hosting" style="width: 180px;">
    </div>
    <div>
      <label for="input-expense-amount" style="font-size: 12px; font-weight: 500; display: block; margin-bottom: 3px;">Amount ($):</label>
      <input type="number" id="input-expense-amount" step="0.01" placeholder="85.00" style="width: 100px;">
    </div>
    <div>
      <label for="select-expense-category" style="font-size: 12px; font-weight: 500; display: block; margin-bottom: 3px;">Category:</label>
      <select id="select-expense-category">
        <option value="Housing">Housing</option>
        <option value="Groceries">Groceries</option>
        <option value="Utilities">Utilities</option>
        <option value="Transport">Transport</option>
        <option value="Dining">Dining</option>
        <option value="Tech">Tech</option>
      </select>
    </div>
    <div>
      <label for="input-expense-date" style="font-size: 12px; font-weight: 500; display: block; margin-bottom: 3px;">Date:</label>
      <input type="date" id="input-expense-date" value="2026-11-12">
    </div>
    <div>
      <button id="btn-add-expense" class="btn btn-primary">Add Expense</button>
    </div>
    <div style="margin-left: auto;">
      <label for="filter-expense-category" style="font-size: 12px; font-weight: 500; margin-right: 6px;">Filter Category:</label>
      <select id="filter-expense-category">
        <option value="all">All Categories</option>
        <option value="Housing">Housing</option>
        <option value="Groceries">Groceries</option>
        <option value="Utilities">Utilities</option>
        <option value="Transport">Transport</option>
        <option value="Dining">Dining</option>
        <option value="Tech">Tech</option>
      </select>
    </div>
  </div>

  <div class="main-grid">
    <div>
      <table id="expenses-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="expenses-tbody"></tbody>
      </table>
    </div>

    <div class="sidebar">
      <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 12px;">Category Breakdown</h3>
      <div id="cat-breakdown-list"></div>
    </div>
  </div>
</div>

<script>
(function() {
  let budgetLimit = 2500;
  let budgetSaved = false;

  let expenses = [
    { id: 'apartment-rent', date: '2026-11-01', desc: 'Apartment Rent', category: 'Housing', amount: 1200.00 },
    { id: 'internet-fiber', date: '2026-11-03', desc: 'Internet Fiber', category: 'Utilities', amount: 70.00 },
    { id: 'supermarket-haul', date: '2026-11-05', desc: 'Supermarket Haul', category: 'Groceries', amount: 145.50 },
    { id: 'bus-transit-pass', date: '2026-11-08', desc: 'Bus Transit Pass', category: 'Transport', amount: 60.00 }
  ];

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  function recomputeTotals() {
    const totalSpent = expenses.reduce((sum, e) => sum + e.amount, 0);
    const remaining = budgetLimit - totalSpent;

    document.getElementById('stat-budget-limit').textContent = '$' + budgetLimit.toFixed(2);
    document.getElementById('stat-total-spent').textContent = '$' + totalSpent.toFixed(2);
    
    const remEl = document.getElementById('stat-remaining-budget');
    const statusEl = document.getElementById('stat-budget-status');

    if (remaining < 0) {
      remEl.textContent = '-$' + Math.abs(remaining).toFixed(2);
      remEl.className = 'stat-val status-warn';
      statusEl.textContent = 'Over Budget';
      statusEl.className = 'stat-val status-warn';
    } else {
      remEl.textContent = '$' + remaining.toFixed(2);
      remEl.className = 'stat-val status-safe';
      statusEl.textContent = 'Safe';
      statusEl.className = 'stat-val status-safe';
    }

    renderBreakdown();
    return { totalSpent, remaining };
  }

  function renderBreakdown() {
    const map = {};
    expenses.forEach(e => {
      map[e.category] = (map[e.category] || 0) + e.amount;
    });

    const container = document.getElementById('cat-breakdown-list');
    container.innerHTML = '';
    const keys = Object.keys(map).sort();
    keys.forEach(k => {
      const row = document.createElement('div');
      row.className = 'breakdown-row';
      row.innerHTML = `<span>${k}</span><strong>$${map[k].toFixed(2)}</strong>`;
      container.appendChild(row);
    });
  }

  function renderTable() {
    const tbody = document.getElementById('expenses-tbody');
    const filter = document.getElementById('filter-expense-category').value;
    tbody.innerHTML = '';

    recomputeTotals();

    expenses.forEach(e => {
      if (filter !== 'all' && e.category !== filter) return;

      const tr = document.createElement('tr');
      tr.id = 'expense-row-' + e.id;
      tr.innerHTML = `
        <td>${e.date}</td>
        <td><strong>${e.desc}</strong></td>
        <td><span class="cat-badge">${e.category}</span></td>
        <td>$${e.amount.toFixed(2)}</td>
        <td>
          <button id="btn-del-expense-${e.id}" class="btn btn-danger btn-del" data-id="${e.id}" style="padding:2px 8px;font-size:11px;">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('.btn-del').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.getAttribute('data-id');
        expenses = expenses.filter(x => x.id !== id);
        budgetSaved = false;
        renderTable();
      });
    });
  }

  document.getElementById('btn-set-budget').addEventListener('click', () => {
    const val = parseFloat(document.getElementById('input-monthly-budget').value);
    if (!isNaN(val) && val > 0) {
      budgetLimit = val;
      budgetSaved = false;
      recomputeTotals();
    }
  });

  document.getElementById('btn-add-expense').addEventListener('click', () => {
    const descInput = document.getElementById('input-expense-desc');
    const amtInput = document.getElementById('input-expense-amount');
    const catInput = document.getElementById('select-expense-category');
    const dateInput = document.getElementById('input-expense-date');

    const desc = descInput.value.trim();
    const amount = parseFloat(amtInput.value);
    const category = catInput.value;
    const date = dateInput.value;

    if (!desc || isNaN(amount) || amount <= 0) return;

    const id = slugify(desc);
    expenses.push({ id, desc, amount, category, date });

    descInput.value = '';
    amtInput.value = '';
    budgetSaved = false;
    renderTable();
  });

  document.getElementById('filter-expense-category').addEventListener('change', renderTable);

  document.getElementById('btn-save-budget').addEventListener('click', () => {
    const totals = recomputeTotals();
    budgetSaved = true;
    const banner = document.getElementById('budget-status-banner');
    banner.className = 'status-banner success';
    banner.textContent = `Budget report saved: ${expenses.length} expenses totaling $${totals.totalSpent.toFixed(2)} (Remaining: $${totals.remaining.toFixed(2)})`;
  });

  // Initial render
  renderTable();

  // Verification hook (REAL DOM only - no self-simulation)
  window.__agyVerify = function() {
    const failures = [];
    const totals = recomputeTotals();
    const bannerText = document.getElementById('budget-status-banner').textContent.trim();
    const limitText = document.getElementById('stat-budget-limit').textContent.trim();

    if (!budgetSaved) {
      failures.push('Budget report not saved via btn-save-budget');
    }
    if (budgetLimit !== 3000) {
      failures.push(`Budget limit expected $3000, got ${budgetLimit}`);
    }
    if (limitText !== '$3000.00') {
      failures.push(`Budget limit text expected '$3000.00', got '${limitText}'`);
    }
    if (expenses.length !== 6) {
      failures.push(`Expected 6 expenses, got ${expenses.length}`);
    }
    if (totals.totalSpent !== 1673.00) {
      failures.push(`Total spent expected 1673.00, got ${totals.totalSpent}`);
    }
    if (totals.remaining !== 1327.00) {
      failures.push(`Remaining expected 1327.00, got ${totals.remaining}`);
    }
    if (!bannerText.includes('Budget report saved: 6 expenses totaling $1673.00 (Remaining: $1327.00)')) {
      failures.push(`Banner text mismatch, got '${bannerText}'`);
    }

    // Verify Cloud Server Hosting and Weekly Groceries are present
    const cloud = expenses.find(e => e.id === 'cloud-server-hosting');
    if (!cloud || cloud.amount !== 85.00) {
      failures.push('Missing or invalid Cloud Server Hosting expense');
    }
    const groc = expenses.find(e => e.id === 'weekly-groceries');
    if (!groc || groc.amount !== 112.50) {
      failures.push('Missing or invalid Weekly Groceries expense');
    }
    const watch = expenses.find(e => e.id === 'luxury-watch');
    if (watch) {
      failures.push('Luxury Watch should have been deleted');
    }

    return {
      passed: failures.length === 0,
      failures,
      score: failures.length === 0 ? 1 : 0,
      state: {
        saved: budgetSaved,
        budgetLimit,
        totalSpent: totals.totalSpent,
        remaining: totals.remaining,
        expenseCount: expenses.length,
        banner: bannerText
      }
    };
  };
})();
</script>
</body>
</html>
