<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus Engine Pomodoro Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; color: #1e293b; padding: 24px; }
    .container { max-width: 850px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 20px; }
    h1 { font-size: 20px; color: #0f172a; }
    .status-banner { padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; display: none; margin-bottom: 20px; }
    .status-banner.success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-banner.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .mode-pills { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; }
    .mode-btn { padding: 8px 18px; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; }
    .mode-btn.active { background: #dc2626; color: #fff; border-color: #dc2626; }
    .timer-card { background: #fef2f2; border: 2px solid #fecaca; border-radius: 12px; padding: 36px 20px; text-align: center; margin-bottom: 24px; transition: all 0.2s ease; }
    .timer-card.break-mode { background: #f0fdf4; border-color: #bbf7d0; }
    .timer-clock { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; color: #991b1b; letter-spacing: -1px; margin-bottom: 8px; }
    .timer-card.break-mode .timer-clock { color: #166534; }
    .cycle-subtitle { font-size: 14px; font-weight: 600; color: #7f1d1d; }
    .timer-card.break-mode .cycle-subtitle { color: #14532d; }
    .timer-controls { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
    .btn { padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-action { background: #dc2626; color: #fff; padding: 10px 24px; font-size: 15px; }
    .timer-card.break-mode .btn-action { background: #16a34a; }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
    .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 14px; text-align: center; }
    .stat-val { font-size: 20px; font-weight: 700; color: #0f172a; margin-top: 4px; }
    .stat-lbl { font-size: 12px; color: #64748b; font-weight: 500; }
    .history-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 16px; }
    .history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .history-row { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 8px 12px; border-radius: 4px; border: 1px solid #e2e8f0; font-size: 13px; }
    /* Settings Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-box { background: #fff; border-radius: 8px; width: 380px; padding: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.2); }
    .modal-field { margin-bottom: 12px; }
    .modal-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .modal-field input[type="number"] { width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Focus Engine Pomodoro</h1>
    <div style="display: flex; gap: 10px;">
      <button id="btn-open-settings" class="btn btn-secondary">Settings</button>
      <button id="btn-save-session" class="btn btn-primary">Save Session Log</button>
    </div>
  </header>

  <div id="pomodoro-status-banner" class="status-banner"></div>

  <div class="mode-pills">
    <button id="btn-mode-work" class="mode-btn active">Focus Session</button>
    <button id="btn-mode-short-break" class="mode-btn">Short Break</button>
    <button id="btn-mode-long-break" class="mode-btn">Long Break</button>
  </div>

  <div id="timer-box" class="timer-card">
    <div id="timer-display" class="timer-clock">25:00</div>
    <div id="stat-cycle-display" class="cycle-subtitle">Cycle 1 of 4</div>
    <div class="timer-controls">
      <button id="btn-start-pause" class="btn btn-action">Start</button>
      <button id="btn-complete-cycle" class="btn btn-secondary">Complete Cycle</button>
      <button id="btn-reset-timer" class="btn btn-secondary">Reset</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-lbl">Completed Focus Cycles</div>
      <div id="stat-completed-cycles" class="stat-val">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">Total Focus Time</div>
      <div id="stat-total-focus" class="stat-val">0 min</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">Total Break Time</div>
      <div id="stat-total-break" class="stat-val">0 min</div>
    </div>
  </div>

  <div class="history-card">
    <h2 style="font-size: 15px; font-weight: 600; color: #0f172a;">Session History</h2>
    <div id="history-list" class="history-list">
      <div id="history-empty" style="color: #94a3b8; font-size: 13px; text-align: center; padding: 12px;">No sessions completed yet.</div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal" class="modal-overlay">
  <div class="modal-box">
    <h2 style="font-size: 16px; margin-bottom: 14px;">Timer Settings</h2>
    <div class="modal-field">
      <label for="input-work-duration">Focus Duration (minutes):</label>
      <input type="number" id="input-work-duration" value="25" min="1" max="120">
    </div>
    <div class="modal-field">
      <label for="input-break-duration">Short Break Duration (minutes):</label>
      <input type="number" id="input-break-duration" value="5" min="1" max="60">
    </div>
    <div class="modal-field">
      <label for="input-long-break-duration">Long Break Duration (minutes):</label>
      <input type="number" id="input-long-break-duration" value="15" min="1" max="90">
    </div>
    <div style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
      <input type="checkbox" id="check-auto-break">
      <label for="check-auto-break" style="font-size: 12px; margin-bottom: 0; cursor: pointer;">Auto-start next break cycle</label>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button id="btn-close-settings" class="btn btn-secondary">Cancel</button>
      <button id="btn-save-settings" class="btn btn-primary">Save Settings</button>
    </div>
  </div>
</div>

<script>
(function() {
  let settings = {
    workDuration: 25,
    breakDuration: 5,
    longBreakDuration: 15,
    autoBreak: false
  };

  let currentMode = 'work'; // 'work', 'short-break', 'long-break'
  let currentCycle = 1;
  let isRunning = false;
  let secondsRemaining = settings.workDuration * 60;
  let historyLogs = [];
  let totalFocusMin = 0;
  let totalBreakMin = 0;
  let completedCycles = 0;
  let sessionSaved = false;

  function pad(n) {
    return n < 10 ? '0' + n : String(n);
  }

  function updateClockDisplay() {
    const mins = Math.floor(secondsRemaining / 60);
    const secs = secondsRemaining % 60;
    document.getElementById('timer-display').textContent = `${pad(mins)}:${pad(secs)}`;
    document.getElementById('stat-cycle-display').textContent = `Cycle ${currentCycle} of 4`;
  }

  function setMode(mode) {
    currentMode = mode;
    const box = document.getElementById('timer-box');
    const btnWork = document.getElementById('btn-mode-work');
    const btnShort = document.getElementById('btn-mode-short-break');
    const btnLong = document.getElementById('btn-mode-long-break');

    btnWork.className = 'mode-btn' + (mode === 'work' ? ' active' : '');
    btnShort.className = 'mode-btn' + (mode === 'short-break' ? ' active' : '');
    btnLong.className = 'mode-btn' + (mode === 'long-break' ? ' active' : '');

    if (mode === 'work') {
      box.className = 'timer-card';
      secondsRemaining = settings.workDuration * 60;
    } else if (mode === 'short-break') {
      box.className = 'timer-card break-mode';
      secondsRemaining = settings.breakDuration * 60;
    } else {
      box.className = 'timer-card break-mode';
      secondsRemaining = settings.longBreakDuration * 60;
    }

    isRunning = false;
    document.getElementById('btn-start-pause').textContent = 'Start';
    updateClockDisplay();
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (historyLogs.length === 0) {
      list.innerHTML = '<div id="history-empty" style="color: #94a3b8; font-size: 13px; text-align: center; padding: 12px;">No sessions completed yet.</div>';
      return;
    }

    list.innerHTML = '';
    historyLogs.forEach(item => {
      const row = document.createElement('div');
      row.id = 'history-item-' + item.id;
      row.className = 'history-row';
      row.innerHTML = `
        <div>
          <strong>${item.name}</strong>
          <span style="color: #64748b; margin-left: 8px;">(${item.duration}m, ${item.type})</span>
        </div>
        <div style="font-size: 11px; color: #16a34a; font-weight: 600;">Completed</div>
      `;
      list.appendChild(row);
    });

    document.getElementById('stat-completed-cycles').textContent = completedCycles;
    document.getElementById('stat-total-focus').textContent = `${totalFocusMin} min`;
    document.getElementById('stat-total-break').textContent = `${totalBreakMin} min`;
  }

  document.getElementById('btn-mode-work').addEventListener('click', () => setMode('work'));
  document.getElementById('btn-mode-short-break').addEventListener('click', () => setMode('short-break'));
  document.getElementById('btn-mode-long-break').addEventListener('click', () => setMode('long-break'));

  document.getElementById('btn-start-pause').addEventListener('click', () => {
    isRunning = !isRunning;
    document.getElementById('btn-start-pause').textContent = isRunning ? 'Pause' : 'Start';
  });

  document.getElementById('btn-reset-timer').addEventListener('click', () => {
    isRunning = false;
    document.getElementById('btn-start-pause').textContent = 'Start';
    setMode(currentMode);
  });

  document.getElementById('btn-complete-cycle').addEventListener('click', () => {
    const cycleNum = historyLogs.length + 1;
    if (currentMode === 'work') {
      historyLogs.push({
        id: 'session-' + cycleNum,
        name: `Session ${cycleNum}: Focus`,
        duration: settings.workDuration,
        type: 'Focus'
      });
      totalFocusMin += settings.workDuration;
      completedCycles++;
      renderHistory();
      setMode('short-break');
    } else {
      historyLogs.push({
        id: 'session-' + cycleNum,
        name: `Session ${cycleNum}: Short Break`,
        duration: settings.breakDuration,
        type: 'Break'
      });
      totalBreakMin += settings.breakDuration;
      renderHistory();
      currentCycle++;
      setMode('work');
    }
  });

  document.getElementById('btn-open-settings').addEventListener('click', () => {
    document.getElementById('input-work-duration').value = settings.workDuration;
    document.getElementById('input-break-duration').value = settings.breakDuration;
    document.getElementById('input-long-break-duration').value = settings.longBreakDuration;
    document.getElementById('check-auto-break').checked = settings.autoBreak;
    document.getElementById('settings-modal').style.display = 'flex';
  });

  document.getElementById('btn-close-settings').addEventListener('click', () => {
    document.getElementById('settings-modal').style.display = 'none';
  });

  document.getElementById('btn-save-settings').addEventListener('click', () => {
    const w = parseInt(document.getElementById('input-work-duration').value, 10);
    const b = parseInt(document.getElementById('input-break-duration').value, 10);
    const lb = parseInt(document.getElementById('input-long-break-duration').value, 10);
    const auto = document.getElementById('check-auto-break').checked;

    if (w > 0) settings.workDuration = w;
    if (b > 0) settings.breakDuration = b;
    if (lb > 0) settings.longBreakDuration = lb;
    settings.autoBreak = auto;

    document.getElementById('settings-modal').style.display = 'none';
    setMode(currentMode);
  });

  document.getElementById('btn-save-session').addEventListener('click', () => {
    sessionSaved = true;
    const banner = document.getElementById('pomodoro-status-banner');
    banner.className = 'status-banner success';
    banner.textContent = `Session log saved: ${completedCycles} focus cycles completed (${totalFocusMin} min total focus)`;
  });

  // Initial render
  updateClockDisplay();

  // Verification hook (REAL DOM only - no self-simulation)
  window.__agyVerify = function() {
    const failures = [];
    const bannerText = document.getElementById('pomodoro-status-banner').textContent.trim();

    if (!sessionSaved) {
      failures.push('Session log was not saved via btn-save-session');
    }
    if (settings.workDuration !== 30) {
      failures.push(`Expected work duration 30 min, got ${settings.workDuration}`);
    }
    if (settings.breakDuration !== 6) {
      failures.push(`Expected break duration 6 min, got ${settings.breakDuration}`);
    }
    if (!settings.autoBreak) {
      failures.push('Auto break checkbox should be enabled');
    }
    if (completedCycles !== 2) {
      failures.push(`Expected 2 completed focus cycles, got ${completedCycles}`);
    }
    if (totalFocusMin !== 60) {
      failures.push(`Expected 60 min total focus, got ${totalFocusMin}`);
    }
    if (historyLogs.length !== 3) {
      failures.push(`Expected 3 session history items, got ${historyLogs.length}`);
    }

    if (!bannerText.includes('Session log saved: 2 focus cycles completed (60 min total focus)')) {
      failures.push(`Banner text mismatch, got '${bannerText}'`);
    }

    return {
      passed: failures.length === 0,
      failures,
      score: failures.length === 0 ? 1 : 0,
      state: {
        sessionSaved,
        settings,
        completedCycles,
        totalFocusMin,
        historyCount: historyLogs.length,
        banner: bannerText
      }
    };
  };
})();
</script>
</body>
</html>
