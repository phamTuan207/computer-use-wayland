<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FCC-K test-02 email fixture</title>
<style>
  body{font-family:sans-serif;padding:14px;background:#fafafa;color:#111;}
  .row{display:flex;gap:16px;align-items:flex-start;}
  ul{list-style:none;padding:4px;border:1px solid #999;background:#fff;min-width:220px;}
  li{padding:6px;border-bottom:1px solid #ddd;cursor:pointer;}
  li.flagged::before{content:'* ';}
  .msg{border:1px solid #999;background:#fff;padding:8px;min-width:260px;min-height:80px;}
  .status{margin-top:10px;font-family:monospace;white-space:pre-wrap;}
</style>
</head>
<body>
<h2>Email fixture (offline)</h2>
<div class="row">
  <div>
    <h3>Inbox</h3>
    <ul id="inbox"></ul>
    <h3>Sidebar</h3>
    <button id="sentBtn">Sent</button>
  </div>
  <div class="msg" id="msg">Select a message.</div>
</div>
<div class="msg" id="sent" style="display:none;margin-top:8px;">(Sent folder)</div>
<div id="status" class="status"></div>
<script>
const messages=[
  {id:1,subject:'Vendor quote',sender:'vendor@example.com',read:false,flag:false,archived:false},
  {id:2,subject:'Customer complaint',sender:'cust@example.com',read:false,flag:false,archived:false},
  {id:3,subject:'Meeting request',sender:'boss@example.com',read:false,flag:false,archived:false},
  {id:4,subject:'Newsletter A',sender:'news1@example.com',read:false,flag:false,archived:false},
  {id:5,subject:'Newsletter B',sender:'news2@example.com',read:false,flag:false,archived:false},
  {id:6,subject:'Vendor follow-up',sender:'vendor@example.com',read:false,flag:false,archived:false},
];
const sent=[];
let active=null;
function render(){
  const inbox=document.getElementById('inbox');inbox.innerHTML='';
  for(const m of messages){
    if(m.archived)continue;
    const li=document.createElement('li');li.id='msg'+m.id;li.className=m.flag?'flagged':'';
    li.textContent=m.subject+' - '+m.sender+(m.read?' (read)':'');
    li.onclick=()=>{active=m;document.getElementById('msg').textContent='Subject: '+m.subject+'\nFrom: '+m.sender+'\nBody: ...';};
    inbox.appendChild(li);
  }
  if(sent.length){document.getElementById('sent').style.display='block';document.getElementById('sent').textContent='Sent: '+sent[sent.length-1].subject+' to '+sent[sent.length-1].to;}
  else document.getElementById('sent').style.display='none';
}
document.getElementById('sentBtn').onclick=()=>{document.getElementById('msg').textContent='Sent folder: '+(sent.length?sent[sent.length-1].subject:'empty');};
window.__fcckVerify=function(){
  const failures=[];
  // simulate triage: archive 4,5; flag 2; read 1,6
  messages[3].archived=true;messages[4].archived=true;
  messages[1].flag=true;messages[0].read=true;messages[2].read=true;messages[5].read=true;messages[5].flag=true;
  sent.push({to:'vendor@example.com',subject:'Re: vendor quote - price correction',body:'original 45000 corrected 42000, 45000 and 42000'});
  const inboxLeft=messages.filter(m=>!m.archived).map(m=>m.id);
  if(inboxLeft.length!==4||inboxLeft.includes(4)||inboxLeft.includes(5))failures.push('inbox wrong: '+JSON.stringify(inboxLeft));
  if(!messages[1].flag)failures.push('complaint not flagged');
  if(!messages[0].read||!messages[5].read)failures.push('read state wrong');
  const s=sent[sent.length-1];
  if(!s||s.to!=='vendor@example.com'||!s.subject.includes('price correction'))failures.push('reply missing or wrong');
  if(!s||!s.body.includes('45000')||!s.body.includes('42000'))failures.push('reply body missing prices');
  render();
  const state={inboxLeft,flagged:messages.filter(m=>m.flag).map(m=>m.id),sentCount:sent.length,reply:sent[sent.length-1]};
  const out={passed:failures.length===0,failures,score:failures.length===0?1:0,state};
  document.getElementById('status').textContent=JSON.stringify(out,null,2);
  return out;
};
render();
</script>
</body>
</html>
