<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FCC-K test-03 calendar fixture</title>
<style>
  body{font-family:sans-serif;padding:14px;background:#fafafa;color:#111;}
  .grid{display:grid;grid-template-columns:80px repeat(6,1fr);gap:2px;width:100%;}
  .slot{border:1px solid #bbb;min-height:30px;padding:2px;font-size:12px;}
  .hour{background:#eee;font-weight:bold;}
  .busy{background:#fcc;}
  .free{background:#fff;}
  .new{background:#cfc;}
  .status{margin-top:10px;font-family:monospace;white-space:pre-wrap;}
</style>
</head>
<body>
<h2>Calendar fixture (offline)</h2>
<div id="legend">Existing events are red. Click a free slot to create an event.</div>
<div id="grid" class="grid"></div>
<div id="status" class="status"></div>
<script>
const days=['Tue','Wed','Thu','Fri','Sat'];
const hours=[];for(let h=9;h<=17;h++)hours.push(h);
const busy={Tue:[9,13],Wed:[10,11,14],Thu:[9,12],Fri:[10],Sat:[9,15]};
let events=[];
function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  g.appendChild(document.createElement('div')).className='hour'; // corner
  for(const d of days){const e=document.createElement('div');e.className='hour';e.textContent=d;g.appendChild(e);}
  for(const h of hours){
    const hr=document.createElement('div');hr.className='slot hour';hr.textContent=h+':00';g.appendChild(hr);
    for(const d of days){
      const s=document.createElement('div');s.className='slot free';
      const isBusy=(busy[d]||[]).includes(h);
      s.className='slot '+(isBusy?'busy':'free');
      s.textContent=h+':00';
      s.onclick=()=>{if(!isBusy)createEvent(d,h);};
      g.appendChild(s);
    }
  }
}
function createEvent(day,hour){events.push({title:'Project sync',day,hour,dur:30,attendees:2,reminder:10});render();}
window.__fcckVerify=function(){
  const failures=[];
  // find earliest free Tue 30-min slot (Tue busy 9 and 13). Free 10:00.
  let day='Tue',hour=10;
  for(let h=9;h<=17;h++){if(!(busy['Tue']||[]).includes(h)){hour=h;break;}}
  createEvent(day,hour);
  const ev=events[events.length-1];
  const overlap=(busy[ev.day]||[]).some(h=>Math.abs(h-ev.hour)<1); // 1h block overlap
  if(overlap)failures.push('event overlaps existing on '+ev.day);
  if(ev.day!=='Tue'||ev.hour!==10)failures.push('wrong slot '+ev.day+' '+ev.hour);
  if(ev.dur!==30)failures.push('wrong duration');
  if(ev.attendees!==2)failures.push('missing attendee');
  if(ev.reminder!==10)failures.push('wrong reminder');
  if(ev.title!=='Project sync')failures.push('wrong title');
  const state={event:ev,overlap};
  const out={passed:failures.length===0,failures,score:failures.length===0?1:0,state};
  document.getElementById('status').textContent=JSON.stringify(out,null,2);
  return out;
};
render();
</script>
</body>
</html>
