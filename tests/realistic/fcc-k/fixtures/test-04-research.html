<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FCC-K test-04 research fixture</title>
<style>
  body{font-family:sans-serif;padding:14px;background:#fafafa;color:#111;}
  .row{display:flex;gap:14px;align-items:flex-start;}
  .col{min-width:220px;border:1px solid #999;padding:6px;background:#fff;}
  .card{border:1px solid #ccc;padding:6px;margin:6px 0;cursor:pointer;}
  .status{margin-top:10px;font-family:monospace;white-space:pre-wrap;}
  button{margin:4px 4px 4px 0;padding:6px 10px;cursor:pointer;}
  textarea{width:100%;}
</style>
</head>
<body>
<h2>Research notes fixture (offline)</h2>
<div class="row">
  <div class="col"><h3>Sources</h3>
    <div id="sources"></div>
    <div id="detail" style="margin-top:8px;border:1px solid #ccc;padding:6px;min-height:60px;white-space:pre-wrap;">Click a source card to read its facts.</div>
  </div>
  <div class="col"><h3>Notes</h3>
    <div>Type one fact per line, e.g. "Source A: Alpha Service".</div>
    <textarea id="notesInput" style="min-height:140px;" placeholder="Source A: ..."></textarea>
    <div>Summary:</div>
    <textarea id="summary"></textarea>
    <button id="saveBtn">Save notes</button>
    <div id="savedNotes" style="margin-top:8px;border:1px solid #999;padding:6px;min-height:40px;white-space:pre-wrap;">Not saved yet.</div>
  </div>
</div>
<div id="status" class="status"></div>
<script>
const sources=[
  {id:'A',name:'Alpha Service',price:'$12/mo',support:'email'},
  {id:'B',name:'Beta Service',price:'$19/mo',support:'chat'},
  {id:'C',name:'Gamma Service',price:'$9/mo',support:'phone'},
];
function render(){
  const s=document.getElementById('sources');s.innerHTML='';
  for(const so of sources){
    const c=document.createElement('div');c.className='card';c.id='src'+so.id;
    c.textContent=so.id+': '+so.name;
    c.onclick=()=>{
      document.getElementById('detail').textContent='Source '+so.id+': '+so.name+'\nMonthly price: '+so.price+'\nSupport channel: '+so.support;
    };
    s.appendChild(c);
  }
}
document.getElementById('saveBtn').onclick=()=>{
  const notes=document.getElementById('notesInput').value;
  const summary=document.getElementById('summary').value;
  document.getElementById('savedNotes').textContent='Saved notes:\n'+notes+'\nSummary: '+summary;
};
window.__fcckVerify=function(){
  // REAL DOM assertion: reads only the notes textarea, the summary, and the
  // saved snapshot the agent actually produced. Never writes notes itself.
  const failures=[];
  const notes=document.getElementById('notesInput').value;
  const lines=notes.split('\n').map(l=>l.trim()).filter(l=>l);
  const count=(label)=>lines.filter(l=>l.includes(label)).length;
  if(lines.length!==6)failures.push('expected 6 fact lines, got '+lines.length);
  if(count('Source A')!==2)failures.push('Source A facts: '+count('Source A'));
  if(count('Source B')!==2)failures.push('Source B facts: '+count('Source B'));
  if(count('Source C')!==2)failures.push('Source C facts: '+count('Source C'));
  const summary=document.getElementById('summary').value.trim();
  if(summary.length<20)failures.push('summary too short: '+summary.length);
  const savedText=document.getElementById('savedNotes').textContent;
  if(!savedText.includes('Saved notes:'))failures.push('notes not saved');
  if(savedText.includes('Saved notes:')&&!savedText.includes(summary.slice(0,20)))failures.push('saved snapshot missing summary');
  const state={factLines:lines.length,perSrc:{A:count('Source A'),B:count('Source B'),C:count('Source C')},summaryLen:summary.length,saved:savedText.includes('Saved notes:')};
  const out={passed:failures.length===0,failures,score:failures.length===0?1:0,state,note:'DOM-only research check'};
  document.getElementById('status').textContent=JSON.stringify(out,null,2);
  return out;
};
render();
</script>
</body>
</html>
